<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate us</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
    body {
      height: 100vh;
      background: url("https://img.freepik.com/free-photo/temple-tomb-structure-from-ancient-egypt_23-2151611701.jpg?semt=ais_hybrid&w=740&q=80");
      background-size: cover;
      background-repeat:no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    img {
      animation: up 4s ease-in-out .5s infinite alternate;
    }

    @keyframes up {
  0% {
    transform: translate(0px, 0px);
  }

  25% {
    transform: translate(-20px, 0px);   
  }

  50% {
    transform: translate(0px, 20px);    
  }

  75% {
    transform: translate(0px, -20px);  
  }

  100% {
    transform: translate(20px, 0px);  
  }
}

  </style>
</head>
<body>
  <h1 style="font-size: 4rem; margin-bottom: 3rem;color: white;">Donate Us</h1>
  <div style="height: 20rem; width: 20rem;">
  <img src="Untitled.png" alt="" style="height: 100%; width: 100%;">
</div>
</body>
</html>
